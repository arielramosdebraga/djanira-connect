# Configuração do Supabase local para desenvolvimento e testes.
# Os serviços são executados pelo Supabase CLI sobre o Docker Desktop.

project_id = "djanira-connect-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = false

[analytics]
enabled = false
